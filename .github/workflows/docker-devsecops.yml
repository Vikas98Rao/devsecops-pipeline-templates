# GitHub Actions - Docker Build and DevSecOps Security Pipeline
# Author: Vikas Rao | Senior DevOps Engineer

name: DevSecOps Build Scan and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: GITHUB_TOKEN_PLACEHOLDER

  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  build-and-scan:
    name: Build and Container Scan
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/IMAGE_NAME:latest
          load: true
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/IMAGE_NAME:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: AZURE_CREDENTIALS_PLACEHOLDER
      - name: Deploy with Helm
        run: |
          az aks get-credentials --resource-group rg-aks-prod --name aks-prod-001
          helm upgrade --install my-app ./helm/my-app \
            --namespace production \
            --wait --timeout 5m